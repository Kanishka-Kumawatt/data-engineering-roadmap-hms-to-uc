name: capstone-ci

on:
  pull_request:
    paths: ["capstone/starter/**", ".github/workflows/capstone-ci.yml"]
  push:
    branches: [main]
    paths: ["capstone/starter/**", ".github/workflows/capstone-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone/starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: pytest -q
