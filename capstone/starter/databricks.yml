# Databricks Asset Bundle for Project Phoenix.
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run      -t dev phoenix_daily_sales
# Host/auth come from your CLI profile (databricks auth login) or DATABRICKS_HOST / client-credential env vars in CI.

bundle:
  name: phoenix

include:
  - resources/*.yml

variables:
  catalog:
    description: Target Unity Catalog catalog for this environment
    default: phoenix_dev
  notify_email:
    description: Where failure notifications go
    default: you@example.com

targets:
  dev:
    mode: development     # resources prefixed with your user name, schedules paused
    default: true
    variables:
      catalog: phoenix_dev

  prod:
    mode: production
    variables:
      catalog: phoenix_prod
    # In a real project prod runs as a service principal:
    # run_as:
    #   service_principal_name: "<application-id>"
