[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix"
version = "0.1.0"
description = "Capstone: HMS -> Unity Catalog migration toolkit + Daily Sales medallion pipeline"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = ["notebooks", "legacy_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
